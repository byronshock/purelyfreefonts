[debian_unclassed]
value = "allow_four"
ruling = "Four licenses Debian's copyright files name qualify: X11, BSL-1.0 and Artistic-2.0 as permissive, MPL-2.0 as an open font license (all redistributable). Artistic-1.0 is researched and comes back to the owner. In config/licenses.toml [allowed]."
reason = "Claude's recommendation."

[gpl_font_exception]
value = "allowed"
ruling = "GPL and LGPL with the font exception (Font-exception-2.0) are allowed, in the open-font group."
reason = "Claude's recommendation; config/licenses.toml already lists them."

[no_license_families]
value = "research_top700"
ruling = "A family with no license found stays excluded automatically, but Claude researches any such family that would reach the overall top 700."
reason = "Claude's recommendation."

[LIC-lack]
choice = "c"
recommended = true
ruling = "Excluded"
reason = "Lack (Velvetyne) publishes no license and the font says All rights reserved: excluded until a license is published."

[LIC-letters]
choice = "d"
