# Owner rulings of 2026-09-28, gate LIC, given in chat after the finish-gates-2 run. Ruled by the
# owner, Byron Shock; recorded by Claude from the lead's notes (design/rulings-2026-09-26.toml,
# [gates_2026-09-28]: nolicense_25, keep_monaspace_cascadia_gfsdidot). Also in AUTHORITY.md. The
# owner took Claude's recommendation each time. The LIC-<family> answers after the Monaspace ones
# are the 25 families with no license found that would reach the overall top 700 (ruling
# no_license_families of 2026-09-26): each names the license Claude found (spdx) and its source.
# Seven of them are builds that fold into their family at gate A (../aliases/2026-09-28.toml).

