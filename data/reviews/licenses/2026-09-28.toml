[LIC-spdx-artistic-1-0]
choice = "a"
recommended = true
group = "permissive"
ruling = "Qualifies and redistributable"
reason = "Claude's research (debian_unclassed); this answer replaces the 2026-09-26 ruling that sent Artistic-1.0 to research. The Artistic License 1.0 puts no condition on use. It allows verbatim copies 'without restriction' (clause 1), modification with a notice and one of four conditions (clause 3), and aggregation with commercial software (clauses 5 and 8); it forbids only charging 'a fee for this Package itself'. Debian ships it in main. No catalog family uses it today: Debian's two Artistic font packages, fonts-alee (Hangul) and fonts-f500, are unmatched."

