# Owner rulings of 2026-09-29, gate LIC, given in chat after the data-fix run (m1/wave1 f708e5a). Ruled by the owner,
# Byron Shock; recorded by Claude from the lead's notes. Also in AUTHORITY.md. The owner took Claude's recommendation
# each time. Question 1: the 11 disagreements that reading the last 8 license strings raised (8 TeX Gyre families,
# IBM 3270, B612 and B612 Mono) and the two new Fontist licenses (AU Passata, fontopo). Question 2: FreeFont.
# Question 3: ET Book (its category is in config/category-overrides.toml). Question 5: Linux Libertine and Linux
# Biolinum, whose files are CTAN's copies (config/font-files.toml; gate L). Where the queue printed another
# recommendation than the one Claude gave in chat, the answer records Claude's letter as recommendation.

[LIC-tex-gyre-adventor]
choice = "a"
recommended = true
group = "open-font"
spdx = "LicenseRef-GUST-Font-License"
ruling = "Qualifies and redistributable"
reason = "Claude's recommendation (question 1 of 2026-09-29), taken by the owner: the TeX Gyre fonts are under the GUST Font License, as the owner ruled for TeX Gyre Heros on 2026-09-26. Fontist's LPPL-1.3c is the license the GUST Font License grants by reference; Arch's LicenseRef-GUST-Font-1.0, which L1 now reads, names the GUST Font License itself."

