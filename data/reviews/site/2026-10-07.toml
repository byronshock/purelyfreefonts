ruling = "The note \"Why isn't my favorite free font here?\" moves from the front page to the About page, and the front page stops after the lead. Its rewrite as a conversation that ends with the tip pitch happens there, and the empty-search message on the front page links to it. This replaces the placement in why_not_listed_after_list (2026-09-30, after the fonts) and why_not_listed_layout (2026-09-29)."
