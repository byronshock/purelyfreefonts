# Owner ruling on the Nerd Fonts download link (Backlog TASK-2 spike).
# Ruled by the owner, Byron Shock, in chat on 2026-09-28. Recorded by Qwen the same day.
# Also recorded in AUTHORITY.md (Site (Milestone 2)) and applied in docs/milestone-1.md
# (steps 14, 15) and docs/milestone-2.md (steps 2, 3, 4). Findings: docs/nerd-fonts-link.md.
# Each ruling: the value chosen; ruling = what it means; reason = Qwen's summary of why.

[nerd_fonts_link]
value = "adopted; row and details panel"
url = "https://github.com/ryanoasis/nerd-fonts/releases"
label = "Nerd Fonts build"
ruling = "Catalog families with a Nerd Fonts build (alias table, relation build) get a nullable links.nerd in both catalog schemas, landing before the M1 step 20 v1 freeze. One shared target: the Nerd Fonts repository releases page, never a release asset or /releases/latest. Link text 'Nerd Fonts build', destination named per the M2 step 4 convention. It shows on the list row and in the details panel, in every view, only for families that have a build."
reason = "About 59% of Homebrew font installs are Nerd builds and D7 counts them toward the original family, so visitors often want the patched build. The spike found no license obstacle: every base license and all 14 patched icon sets pass Rules 1-4 (Font Logos' 'unlicensed' is The Unlicense), and the step 14/15 code is still stubs, so the field is cheapest now. The owner chose row-and-details over details-only."
