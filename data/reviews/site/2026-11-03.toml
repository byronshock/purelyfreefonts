# Owner rulings of 2026-11-03 on the wordmark, asked as single-select questions in the session in his typeface tools (penleft)
# that wrote the plate. Ruled by the owner, Byron Shock; recorded by Claude. Also in AUTHORITY.md (Headline font).

[wordmark_brush_102]
choice = "a"
recommended = true
value = "pointforms build/wordmarks/purely-free-fonts-plate-brush102.svg sha256:0aa7b9e5ac1bba0c58c95508598a1de3b794cd0eb361921f7abc27725f749e56"
ruling = "The wordmark is \"Purely Free Fonts\" in the owner's typeface Purely Constructed at brush 102: near-black (#111111) letters on a white plate that fills its 9845 x 1250 viewBox (his file purely-free-fonts-plate-brush102.svg, from his typeface project pointforms). It replaces the Book, brush 90 (wordmark_book_plate), and is made the same way: shaped by HarfBuzz with the font's kerning, outlined with fontTools, 100 units of clear space round the ink, from pointforms at 67f0158 built as a release weight is, at 102 font units. Brush 102 is not a release weight; its font is beside the plate (PConstructed-Brush102.otf). It is the heaviest brush whose s keeps the Book's round tails: from 103 up they are cut on the slant, as in the Medium the owner turned down on 2026-10-14 (the uncut limit is (9√5 − 15)/5 font units, 102.49). The site serves it byte for byte as site/static/wordmark.svg, pinned by sha256 in tests/site/test_shell.py."
reason = "The owner: \"It is coming across as too light with some very bold fonts on the same page, so I'd like to preview the SVG wordmark at various weights.\" Having seen it at the six 0.900 release weights, of (a) the Medium, brush 120 (Claude's recommendation), (b) the Demi, brush 150, (c) brushes between 90 and 150 and (d) keeping the Book, he chose (c). Brushes 90 to 150 showed the s's tails cut from 110, and he took Claude's recommendation to find where they change (brushes 101 to 109). Then, of (a) brush 102, (b) a heavier brush, 110 to 150, with the cut s, and (c) keeping the Book, he took Claude's recommendation, (a), though its strokes are only 13% heavier than the Book's, hard to tell apart at header size."

[wordmark_size_brush_102]
value = "caps_38_and_24_4_px"
ruling = "The brush-102 wordmark keeps the Book's capital height (wordmark_size_book): about 38 px on wide screens, 465 x 59 px from 816 px (51rem) up, the img's width and height in the plate's 9845:1250 ratio. Below that it stays 300 px wide (300 x 38, capitals about 24.4 px), shrinking to fit the narrowest phones (288 px at 320). The breakpoint stays at 816 px: the widest one-row header is now 16 + 465 + 24 + 281 + 16 = 802 px. The 300 px wordmark still keeps the navigation beside it from 637 px; 308 px, for capitals of 25 px, would push the navigation under the wordmark between 640 and 645 px."
reason = "Not asked as a size of its own: the owner chose the capital height for the Book on 2026-10-14 (\"I imagine we will want the same cap height adjustment.\"), and the question that sent this change to its own session named the size: \"Put the brush-102 wordmark on the Purely Free Fonts site now? It's a change in truly_free_fonts: the file, its sha256 pin in the tests, the header size (465 × 59) and a ruling.\" Of (a) a session of its own (Claude's recommendation) and (b) not now, he chose (a): \"Start it\"."
