[noscript_previews]
value = "keep_all"
ruling = "Keep every <noscript> preview image; Milestone 2 step 5's clause now reads that they carry loading=\"lazy\" (browsers load them all when scripts are off)."
reason = "Claude's recommendation."

[list_layout]
