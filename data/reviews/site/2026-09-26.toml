ruling = "Keep \"Not ranked: no evidence of deliberate installs\", with the reason on its own line, and keep both attribution options; watch both in usability round 1."
reason = "Claude's recommendation. Applied: an unranked row carries li.font.is-unranked (server and script), which puts its label on a line of its own above the name instead of down the rank column (site/css/20-list.css)."

[top100_display]
