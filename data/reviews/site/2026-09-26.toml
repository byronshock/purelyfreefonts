[about_page]
value = "name_fonts_no_ads_not_owner"
ruling = "The about page names Satoshi, General Sans and Clash Display as examples of the ITF license, keeps \"no ads\", and does not name the owner."
reason = "Claude's recommendation."

[log_fields]
value = "trim_referer_user_agent"
ruling = "The Caddy access log also drops Referer and User-Agent; /privacy describes the log accordingly; the Caddyfile change goes out with its checked deploy line (ops/SERVER.md item 25); AUTHORITY.md's visitor-privacy line is updated."
reason = "Claude's recommendation, picked in chat (\"Trim Referer and User-Agent (Recommended)\"): the log needs neither to find errors or count pages. Not part of the ruling: the same Caddyfile change also drops Cookie and Cloudflare's location headers finer than the country. Those are Claude's addition, in the spirit of ruling M2-D9, and go back to the owner to confirm."

