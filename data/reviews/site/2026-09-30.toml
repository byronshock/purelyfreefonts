# Owner rulings of 2026-09-30 on the site, given in chat to Claude during the local test drive of pull request #23. Ruled by the owner, Byron Shock; recorded by Claude. Also in AUTHORITY.md.

[specimen_max_size]
value = "16_KB_gzip"
ruling = "A specimen may be up to 16 KB compressed (gzip -9, decimal kilobytes, about what a visitor downloads), in place of 30 KB uncompressed; a larger one is drawn with the family name only. The other specimen budgets stay: at least half at or under 5 KB gzip -9, all under 10 MB uncompressed."
reason = "The owner, in chat: \"Why do we have a 30 KB threshold?\" Claude showed that the raw cap made six fonts name-only although each was 7 to 15 KB compressed (Geist Pixel: 215 KB raw, 7.1 KB gzip) and suggested a cap on compressed size of about 15 KB; the owner answered \"I am OK with files under 16 KB.\""

[redistributable_only]
value = "redistributable_fonts_only"
ruling = "A font qualifies only if its license also lets anyone pass the font files on (Rule 3, in place of the rule of 2026-09-25 under which a use-unrestricted license that forbade redistribution still qualified). The site lists only redistributable fonts, drops the \"Redistributable fonts only\" option, the \"Not redistributable\" badge and the details panel's Redistributable row, and says less about sharing. The license review's option (b), \"Qualifies but not redistributable\", is retired: such a family is excluded."
reason = "The owner, in chat during the local test drive of pull request #23: \"We only curate fonts that are redistributable. This gate won't shut on any of the September top 500. We could then simplify language about sharing the fonts.\" In the 2026-09-29 real run every one of the 500 catalog fonts was redistributable."

[details_layout]
choice = "a"
recommended = true
value = "essentials_first_evidence_folded"
ruling = "A font's details panel shows essentials first: the \"Type your own text\" button (the font still loads only on a click), then one short list (Get it: the official, designer and Nerd Font build links; License, with whether credit is needed; Font: formats and Latin coverage; Comes with; Also known as; Rank: the rank chosen in the selector, with its likely range), then \"Report a problem\". A closed \"All ranks and sources\" disclosure holds every rank with tier and range, the tier legend, \"Pulled in by\" and the per-source tables. The section headings, the license-group row, the Redistributable row, the Spacing row and the repeated Nerd Font legend are dropped."
reason = "The owner, in chat: \"This page is very busy when I drop down a font. We need to make it far less busy.\" Of three layouts Claude offered (this one; today's sections, trimmed; the evidence moved to its own page), the owner took Claude's recommendation."

[monospace_category]
choice = "a"
recommended = true
value = "monospace_in_category_only"
ruling = "The Spacing filter (ruling spacing_filter of 2026-09-25) is removed. The Category filter's \"Monospace\" means every monospaced font (is_monospace, the list the Coding rank orders), and the other categories list proportional fonts only; the row's category label follows. The catalog's category field is unchanged. The Coding fonts rank stays. An old link with spacing=monospaced opens the Monospace category."
reason = "The owner, in chat: \"it seems some of them duplicate one another. I want sensible filters.\" In the 2026-09-29 run Category \"Monospace\" held 89 fonts, Spacing \"Monospaced\" 97 and the Coding rank the same 97: one list three ways. Of three options (this one; keep Spacing and drop the category; this one and drop the Coding rank), the owner took Claude's recommendation."

[license_filter]
choice = "a"
recommended = true
value = "no_credit_required_only"
ruling = "The License filter is one checkbox, \"No credit required\" (hash hide=attr), which hides the fonts whose license requires credit. It is shown only while some listed font needs credit. The four license-group checkboxes (ruling license_filter_groups of 2026-09-25) and \"Hide attribution required\" are removed; the groups remain the license classes of the data. This replaces the list_layout ruling of 2026-09-26 where it kept both attribution options."
reason = "With Rule 3 of 2026-09-30 every listed font is redistributable, and in the 2026-09-29 run no catalog font needed credit, 476 of 500 were open font licenses and one was in \"Other free-use grants\": the group checkboxes and \"Hide attribution required\" repeated each other. Of three options (this one; one License select; no license filter), the owner took Claude's recommendation."

[front_page_lead_sharing]
choice = "a"
recommended = true
value = "you_may_share_the_files"
ruling = "The front page's lead reads \"Every font here is free for any personal or commercial use, and you may share the files. They are ranked by how many people install them and use them in their work.\" in place of the owner's wording of 2026-09-29 (front_page_lead). The note \"Why isn't my favorite free font here?\" (why_not_listed) drops \"or don't let you pass the font files on\": its sentence now reads \"Some of these fonts ask you to credit the designer, and we mark those.\""
reason = "Rule 3 of 2026-09-30 makes every listed font redistributable, so sharing is no longer restricted. Of two wordings (say the files may be shared; drop the clause), the owner took Claude's recommendation."

[filters_layout]
value = "plan_approved_2026-09-30"
ruling = "The filters sit in this order: Search; Rank with its measures line; Category; Features (Variable, Nerd Font available, Accented letters, the last hiding fonts with basic Latin only); License (\"No credit required\"); \"Hide fonts that come with\" as one select (nothing, Windows, macOS, Linux or Android); \"Clear filters\". Sort (by rank or by name) moves to the list header beside the count. Row badges get shorter: \"Comes with\" names operating systems and apps only (Linux distributions become \"Linux\"), \"Pulled in by\" moves to the details panel, and the \"Monospace\" and \"Not redistributable\" badges go. The retired hash keys spacing, lic and redist are dropped from the URL, spacing=monospaced becoming cat=monospace."
reason = "Claude's proposal in the plan the owner approved in chat on 2026-09-30. The owner called the plan provisional: more site cleanup items may follow."

[variable_label]
choice = "a"
recommended = true
value = "adjustable_weight"
ruling = "Variable fonts are labelled \"Adjustable weight (variable font)\" in the filter and \"Adjustable weight\" on the rows' badge, in place of \"Variable\". The details panel's Font line (\"Variable and static\") stays, as it names the file formats."
reason = "The owner, in chat, after asking what separates a monospace font from a variable one: \"Ah, the confusion is 'variable' vs. 'proportional'.\" Of three labels Claude offered (this one; \"Variable font\"; keep \"Variable\"), the owner took Claude's recommendation: it says what a visitor gets, and nearly every variable font has a weight axis."

[sort_header]
value = "column_sort_buttons"
ruling = "Sort is a row of buttons over the list, one over the rank column and one over the names, in place of the Sort select beside the count (filters_layout). Each is a bordered button with its label, two stacked arrows and, on the column in use, the order's words: Rank \"best first\" or \"least used first\", Name \"A-Z\" or \"Z-A\". The arrow for the current order is filled with the accent and the other faint; on the column not in use both are grey. Clicking the button in use reverses its order; clicking the other sorts by it in its usual order (best first, A-Z). The hash's sort key takes rank (default), rank-desc, name and name-desc. Reversing the rank is a true reverse: fonts without a rank come first. The list header stays over the rank numbers until the score bars (score_display) replace them."
reason = "The owner, in chat: \"Rather than a sort drop-down, I would like up-arrow-down-arrow icons on the header row ... The icons need to be very clear that they have this role.\" Of the options Claude offered, the owner took the header over the rank numbers now (the score bars stay their own step) and bordered buttons with an arrow and direction words (both Claude's recommendations), and chose a true reverse, unranked fonts first, where Claude had recommended keeping them last. Claude drew the arrows as stacked triangles after the glyph arrows proved too small to read."

[ui_font]
value = "arimo_upright_and_italic"
ruling = "Headings and body text are set in Arimo (Steve Matteson, SIL Open Font License 1.1), upright and italic, served from the site itself: a Latin subset of Arimo 1.341 from google/fonts at 23e54b51, as WOFF2 with the weight axis 400 to 700, about 23 KB upright and 26 KB italic. It replaces the system font stack. Every page preloads the upright; font-display is optional, so a late font is never swapped in, and Liberation Sans and Arial, which share Arimo's widths, stand in. Monospace text keeps the system monospace stack. The work waited for pull request #23 to merge."
reason = "The owner, in chat, after comparing League Gothic pairings: \"We are going with Arimo for the headings and body text.\" Asked about timing and italics, the owner chose \"After #23 merges (Recommended)\" and \"Upright and italic (Recommended)\". After mockups of the site in Arimo, iA Writer Quattro and Open Sans: \"OK, I want to keep Arimo. I may regret it later.\""

[more_fonts_timing]
value = "after_launch_own_milestone"
ruling = "Listing every other qualifying font A-Z (more_fonts) and adding fonts on request (font_requests) are not part of getting the site live. They move out of Milestone 1 step 15b and Milestone 2's listed-only items into a milestone of their own, docs/milestone-more-fonts.md, built after Milestone 2's launch and before or after Milestone 3's owned-font tools; the owner chooses which when Milestone 2 is done. Until then the site lists the ranked catalog only, and the methodology page says the rest will follow."
reason = "The owner, in chat: \"Please let's save the 15b work for after the site initially goes live. It could be a separate milestone build before or even after adding the font inventory tools. I just don't think it belongs in the work of getting the site live.\""

[score_previous_bootstrap]
value = "previous_equals_current_until_a_refresh"
ruling = "Before the catalog-site.json v1 freeze, each rank entry gains previous_score: the font's score in that rank in the last published catalog, kept from month to month in state/published_scores.json, or null if it had none there. To bootstrap, and only to bootstrap, last month's score is this month's: until a monthly refresh has been merged no scores are published, so previous_score equals score and no rising or falling triangle can be generated. tff-catalog validate asserts this, in a run and on the committed files. The triangles themselves (Backlog TASK-4) are deferred; the data they need is collected and has its place in the schema."
reason = "The owner, in chat: \"Before we freeze: We must make sure there is a field for last month's score for TASK-4's triangles.\" Then: \"We don't have last month's score. To bootstrap, and only to bootstrap, we are going to assign 'last month' the same score as this month. This should prevent the generation of any red or green triangles. In fact, we can assert this to be the case and defer the work on the red and green triangles so long as we are collecting the data we'll need later and giving it a place to live in the schema.\""

[held_marker_dev_apps]
choice = "a"
recommended = true
value = "one_note_above_the_view"
ruling = "In the score list, a font the two-source rule holds back carries a marker on its row (score_held_fonts), except in Developers & apps, where every font rests on one kind of source: that view shows one note above the list instead, and no row marker."
reason = "Claude's Milestone 2 audit found every one of the 100 top Developers & apps entries in the 2026-09-26 run is gate_held (and 18 in Coding, 6 in most chosen, 4 in most installed), so a row marker there would mark every row. Of two options (one note above that view; a marker on every row), the owner took Claude's recommendation."

[fold_headings]
choice = "a"
recommended = true
value = "keep_inside_the_fold"
ruling = "Inside the closed \"All ranks and sources\" disclosure, the small \"Ranks\" and \"Sources\" headings stay: they separate the two tables for screen readers and show only once the fold is open. The details_layout ruling's dropped section headings are the ones outside the fold."
reason = "Claude's Milestone 2 audit noted that details_layout drops the section headings while these two remain inside the fold. Of two options (keep them there; drop them), the owner took Claude's recommendation."

[sort_two_lines]
choice = "a"
recommended = true
value = "two_line_sort_buttons"
ruling = "The sort buttons put the order's words on a second, smaller line inside the button (\"Rank\" with its arrows, then \"best first\" or \"least used first\"; \"Name\", then \"A–Z\" or \"Z–A\"), so from 40rem the Rank button fits over the 96px rank column and the Name button starts exactly over the names, as sort_header asks."
reason = "Claude's Milestone 2 audit, checked in Chromium and Firefox: on one line the Rank button was 138px wide (181px with \"least used first\"), wider than the 96px rank column that score_display keeps, so the Name button sat 34px right of the names. Of three options (two-line buttons; side by side as before, rewording sort_header; the order's words moved to the count line), the owner took Claude's recommendation."

[held_marker_style]
choice = "a"
recommended = true
value = "hollow_bar"
ruling = "A font the two-source rule holds back (gate_held) shows its score with a hollow bar, drawn as an outline instead of solid blue, and one legend line above the list explains it: \"Hollow bar: this score rests on one kind of source, so it may move more.\" Screen readers hear \"Score 71 of 100, from one kind of source\". Developers & apps marks no row (held_marker_dev_apps)."
reason = "Asked with the plan for the score bars, the owner took Claude's recommendation over a solid bar with a dagger after the number."
