# Owner rulings of 2026-10-06 on the site, from the review of PLAN-REVIEWERS-1.md's step 7c, asked in chat as
# single-select questions. Ruled by the owner, Byron Shock; recorded by Claude. Also in AUTHORITY.md.

[details_nerd_lead_in]
choice = "a"
recommended = true
value = "Nerd Font:"
ruling = "In a font's details, the Nerd Font build link has a visible lead-in, \"Nerd Font:\", like the \"Official:\" row, so the line says what it is even where the maker names the build \"<Family> NF\"."
reason = "With the NF box gone (details_nerd_box_dropped), 9 of the 70 Nerd builds (Cascadia Code NF, Cascadia Mono NF, Ioskeley Mono, Maple Mono NF and the five Monaspace fonts) showed no visible 'Nerd Font' wording; step 7c's review found it. Of (a) a visible lead-in and (b) the link alone with a lead-in for screen readers only, the owner took Claude's recommendation."

[phone_rows_four_in_coding]
choice = "a"
recommended = true
value = "five_in_the_default_view_four_in_coding_and_nerd"
ruling = "On phones, five rows per 812 px screen holds in the default view from 352 px wide; in the Coding view and with the Nerd Font filter four fit, where the longer \"Nerd Font available\" tag wraps more often. Type and the 48 px specimen box are not shrunk to get five there."
reason = "Step 7c's spacing trims (phone_rows_trim) give a 160.2 px median card from 352 px wide; the Coding view's first five take 865 px and the Nerd filter's 840 px at 375 px. Of (a) accepting four there, (b) a shorter tag on phones and (c) a 44 px phone box, the owner took Claude's recommendation."

[wordmark_schoolbook_light]
value = "drawing of purely-free-fonts-schoolbook-light-mixed.svg, source sha256 46254277025d01a5ee9cd86893054517441c06ce115796f0b9a5fb6f67959efe"
ruling = "The wordmark is the owner's new drawing, \"Purely Free Fonts\" in mixed case, light (his file purely-free-fonts-schoolbook-light-mixed.svg), on its white plate in a 9717 x 1400 viewBox. It replaces the capitals of 2026-10-04 (wordmark_owners_svg). The source is kept as site/static/_src/wordmark-source.svg, pinned by sha256."
reason = "The owner: \"I have a new wordmark SVG. I want to use this instead of the existing wordmark.\""

[wordmark_drawing_only]
choice = "a"
recommended = true
value = "strip_editor_data"
ruling = "The site serves the drawing only: the view box, title, white plate and letter paths exactly as drawn, without Inkscape's editor settings, metadata and element ids (make_wordmark.py writes it from the pinned source)."
reason = "Claude's recommendation, over serving Inkscape's file byte for byte: the drawing is unchanged and the file smaller."

[wordmark_size_mixed]
choice = "a"
recommended = true
value = "caps_38_and_25_px"
ruling = "The new wordmark keeps the capital height of about 38 px on wide screens and 25 px on phones: 410 x 59 px from 760 px up and 270 x 39 px below, so the header grows about 13 px taller; wordmark_breakpoint's 760 px stays."
reason = "Claude's recommendation, over keeping the 46 px plate (capitals about 30 px, thinner light strokes)."
