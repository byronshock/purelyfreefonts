value = "every_sort"
ruling = "With a search on, fonts whose own name matches come first, then fonts found only through another name (search_name_first), in every sort: each group keeps the chosen sort, so \"least popular first\" reverses each group rather than the whole list."
reason = "search_name_first said \"in score order\", which the default sort is. Of (a) in every sort (Claude's recommendation) and (b) only in the default sort, the owner chose (a). For a search, this amends sort_header's \"least popular first\" as the exact reverse of the list."
