[step7_list_first]
choice = "a"
recommended = true
value = "7a_7b_7c_first_with_step8_license_checks"
ruling = "PLAN-REVIEWERS-1.md's step 7 list work (7a names-only larger specimens, 7b the NF column and legend, 7c Download as the button) lands right after pull request #56, ahead of step 8's template work and step 5's first part, which wait for the parked claude/projects-default branch. Step 8's parts that touch no template (re-reading Heavy Data's license, proposing a pinned URL for Charter's license) go alongside, so priority 1 keeps moving. This amends the order reviewer_priorities set (2026-09-30)."
reason = "The owner asked to move bigger specimens up. A workflow of eight agents found step 7's list parts need nothing from the scoring freeze or the frozen branch (7b and 7c touch two templates that branch also edits, with an expected one-line conflict). Of (a) this, (b) only 7a first and (c) keeping the order, the owner took Claude's recommendation."

[specimen_trim_served]
choice = "a"
recommended = true
value = "site_build_trims_verified_files"
ruling = "Until build/specimens is redrawn names-only, the site build serves each row's specimen as a copy trimmed to the name line from the committed two-line SVG, after its sha256 check. Only pinned files are trimmed (src/tff_site/trim.sha256: the 500 verified committed specimens and the sample's 5 fixtures, each cut checked against its font's names-only drawing), and 7 names are moved back to where a names-only drawing puts them by a per-file table; any other file passes through untouched. Nothing in build/ or the catalogs changes. While the details panel is frozen the site shows no sample lines; the trim is removed once the redraw lands."
reason = "Both catalogs record each specimen's sha256, so a redraw in place can't meet the lead's byte-identical rebuild condition. Two independent checks re-drew all 500 specimens: the trimmed name matched a name-only redraw in all 500, 7 of them offset 2-22 grid units until realigned; specimens fall from 1.33 to 0.54 MB gzip. Of (a) trimming now, (b) a redraw into new files with their own manifest and (c) waiting for the first live refresh, the owner took Claude's recommendation."

