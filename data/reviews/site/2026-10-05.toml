ruling = "The specimen box is 64 px tall on wide screens from 7a (SPEC_BOX_PX follows it), and 48 px on phones from 7b, when the NF column stops reserving 44 px on rows without a Nerd Font build."
reason = "Measured on all 500 trimmed files with mask-size: contain: desktop names go from a median 25.0 to 53.2 px per em with rows unchanged; phone names from 20.8 to 32.3 with 7a and about 39.9 after 7b, with phone rows about 8 px taller. A taller phone box before 7b gains almost nothing (32.6 against 32.3). Of (a) this, (b) 56 px on desktop and (c) today's boxes, the owner took Claude's recommendation."

[phone_rows_trim]
