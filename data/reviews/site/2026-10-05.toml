ruling = "Milestone 3 gains three Step 0 decisions: present \"Hide fonts that come with\" as the first, no-permission step before the check; a \"Show only mine\" option to check the licenses of fonts a visitor has; and a test that no font name ever enters the page address."
reason = "The outside reviewer's inventory advice, round 4. Of (a) all three, (b) the first step and the address test, (c) the address test only and (d) none, the owner took Claude's recommendation."

