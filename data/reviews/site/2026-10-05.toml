recommended = true
value = "brotli_ci_measures_brotli"
ruling = "The site serves pre-compressed Brotli files (written by the build, served by Caddy with gzip as the fallback), and CI's page budget measures the Brotli size, which is what visitors download."
reason = "Measured on the live files, Brotli cuts the HTML, CSS, JS and list data from 96.1 KB to 76.7 KB (-20%) with no markup change (priority 3). Of (a) this, (b) Brotli with CI still measuring gzip and (c) no Brotli, the owner took Claude's recommendation."

[inventory_additions]
