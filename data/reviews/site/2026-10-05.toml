reason = "Main already shows about five rows per 812 px phone screen (164 px median; the outside reviewer's 285 px was measured on release f6e84b3), and with the license name on every row the merged line fits on one line in only 15 of 304 tagged rows. Of (a) this and (b) merging anyway, the owner took Claude's recommendation."

