# Owner rulings of 2026-09-29, gate K, given in chat in one batch (batch 6) after the real-store
# rebuild of 2026-09-28 (646c4a2), which held 20 catalog members back without an accepted link.
# Ruled by the owner, Byron Shock; recorded by Claude from the lead's notes
# (design/rulings-2026-09-26.toml, [gates_2026-09-29_b6]: K_13_own_pages, K_3_corrected,
# K_sil_pages, K_dead_sites_policy). Also in AUTHORITY.md. The owner took Claude's recommendation
# each time, so each reason is Claude's summary; each pick names its url.
# K_13_own_pages: the 13 printed picks. K_3_corrected, K_sil_pages and K_dead_sites_policy:
# researched overrides of config/link-overrides.toml, each under a new question id and approved as
# "Approve the override". Where an override replaces a printed candidate (Anka/Coder, Awami
# Nastaliq, Cozette, Monofur), the family's own question records its research option ("none of
# these is it"), which Claude recommended in chat, and the approved override wins, as
# K-dejavu-site did on 2026-09-28.
# K_dead_sites_policy: web.archive.org stays an aggregator for every automatic pick, but an
# override the owner approves and marks archived may link a timestamped Wayback Machine capture of
# the designer's page when that page is gone (Heavy Data). K-monofur-page is asked separately: the
# capture approved in chat, 20220910011242, turned out to be a registrar's parking page, so its
# override proposes the last capture of the designer's page, of 2020-02-06, instead.
# K-go-page and K-liberation-serif: the owner's answer to question 6 of 2026-09-29, given in chat
# later that day, once Go and Liberation Serif had font files (config/font-files.toml). K-et-book,
# K-linux-libertine and K-linux-biolinum: the printed picks for the families the owner let in that
# day. The owner took Claude's recommendation each time.

