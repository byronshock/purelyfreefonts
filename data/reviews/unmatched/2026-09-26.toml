ruling = "Hand rows for the packages U_rules and A_sources name, written after reading what each package ships: a bundle row per family for a package that ships several families (D2), one row for a package that ships one."
reason = "Claude's research of 2026-09-26 (Arch and Debian file lists, Homebrew cask definitions). A bundle row's detail is the number of families the package ships; only universe families get rows, and the Noto packages credit their Latin text families only (Noto Sans, Serif, Sans Mono, Sans Display, Serif Display): their script families are never ranked. Metapackages and transitional packages that ship no files get no rows, except fonts-dejavu, which pulls in all of DejaVu."
