[chunk_fold]
value = "fold"
ruling = "Chunk Five (Fontsource's chunk-five, with its npm package @fontsource/chunk-five) folds into Chunk (The League of Moveable Type's foundry list); AUR ttf-chunk, whose files name the family ChunkFive, counts toward Chunk."
reason = "Claude's recommendation, taken by the owner: both universe records are the same typeface from github.com/theleagueof/chunk. Neither was ranked or in the catalog before the fold."

