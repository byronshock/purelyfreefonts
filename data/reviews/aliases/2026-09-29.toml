ruling = "Homebrew's four HackGen and Cica casks fold into Hack as builds (detail \"\", D7), with the name HackGen, through hand rows in data/aliases.csv (reviewed_by claude:2026-09-29); the four families they formed (HackGen, HackGenNerd, Cica and Cica without emoji, each out of the Latin gate as mainly CJK) leave the universe."
reason = "Claude, under the owner's delegation of 2026-09-28 (A_U_queues: rows the owner's earlier answers already decide), applying the owner's gate A ruling leftover_cica_hackgen (2026-09-28, batch 5, which made Arch's ttf-hackgen and ttf-cica builds of Hack): HackGen and Cica are Hack's Latin composited with Japanese glyphs, and the casks install those same fonts from the designers' releases."

