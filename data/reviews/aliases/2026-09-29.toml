ruling = "deb-pkg:fonts-adwaita and deb-src:fonts-adwaita get the package rows to Adwaita Sans that the rulings of 2026-09-28 gave them, as hand rows in data/aliases.csv dated as those rulings (first_seen 2026-09-28, reviewed_by claude:2026-09-28)."
reason = "Claude, carrying out its rulings of 2026-09-28 (U-115b853c4cd3, A-a49b3ac465 and A-a04c72303e, under the owner's delegation A_U_queues and ruling leftover_packages): the gate A items proposed the umbrella family Adwaita, which left the universe when the owner's ruling umbrella_casks made font-adwaita a bundle, so they matched no candidate any more and their rows never reached data/aliases.csv; `map --check-unmatched 200` listed deb-pkg:fonts-adwaita at Debian #148. fonts-adwaita is a metapackage that depends on fonts-adwaita-sans, and its source builds only those two packages (https://sources.debian.org/data/main/f/fonts-adwaita/51.0+dfsg-1/debian/control)."

