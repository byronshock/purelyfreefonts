# Owner rulings of 2026-09-30, gate A, given in chat. Ruled by the owner, Byron Shock; recorded by Claude. Also in AUTHORITY.md.
# The rows they add or move are hand rows in data/aliases.csv (reviewed_by owner:2026-09-30): Homebrew's font-sn-pro counts toward SN Pro (package);
# the SIL renames and Selawik fold as sil_selawik_folds says. sil_selawik_folds was given in chat with the lead session, the others in chat with Claude.

[sn_pro_fold]
value = "fold"
ruling = "Homebrew's font-sn-pro, whose cask title is \"SN Pro Font Family\", counts toward SN Pro as a package row, as font-geist counts toward Geist (ruling duplicates, 2026-09-28). The family SN Pro Font Family leaves the universe and the catalog, and its own rulings lapse: its gate K link to Supernotes' page (K-sn-pro-font-family, 2026-09-29), its category override (categories_22, 2026-09-29) and its L3 research entry in config/license-texts.toml. Its license ruling LIC-sn-pro-font-family (2026-09-28) no longer names a family."
reason = "Claude's recommendation, taken by the owner. The cask installs Supernotes' SN-Pro.zip 1.5.0, whose fonts carry the family name \"SN Pro\": the same designer (Tobias Whetton) and version (1.005) as google/fonts' ofl/snpro, which Supernotes contributed from github.com/supernotes/sn-pro. Only Homebrew's cask title made the universe mint a second family. A replay of the 2026-09-26 snapshots with the row: SN Pro moves overall from 393 to 286 and gains desktop places 259 (most chosen) and 262 (most installed); the catalog has 499 fonts, because no other font is at 450 or better to enter (gate M11's hysteresis); no exact top-100 rank changes."

[sn_pro_fold_timing]
value = "first_live_refresh"
ruling = "The SN Pro fold (sn_pro_fold) goes to main as the ruling, the alias row and the config only. build/ keeps the published 2026-09-26 catalog, SN Pro Font Family included, until the first live refresh (docs/milestone-refresh.md step 1) builds the fold in."
reason = "The owner's choice; Claude had recommended treating a replay of the only merged run's own date as the bootstrap, so the rebuilt catalog could go in now. The fold's rebuild moves 2026-09-26 scores (SN Pro 0.18 to 0.38, small shifts elsewhere), and since #31 put that run's scores in state/, a replay sets each moved previous_score to the published score, which validate --committed's bootstrap check (score_previous_bootstrap) refuses. Until the first live refresh, any rebuild of build/ from main picks up the fold and meets the same check."

[sil_selawik_folds]
value = "fold"
ruling = "Four more duplicates fold, as sn_pro_fold did: Charis (Homebrew font-charis, Fontist sil/charis_7.000, Arch ttf-charis and charis-font) into Charis SIL; Gentium (Homebrew font-gentium, Fontist sil/gentium_7.000, and Debian's fonts-sil-gentium and ttf-gentium, the 2003 Gentium 1.02) into Gentium Plus; Gentium Book (Homebrew font-gentium-book, Arch ttf-gentium-book and gentium-book-font) into Gentium Book Plus; and Selawik (Fontist selawik) into Microsoft Selawik, shown as Selawik. Hand rows in data/aliases.csv (reviewed_by owner:2026-09-30): the font-name renames Charis, Gentium and Gentium Book, the font-name display rename Selawik, and the package rows moved to the survivors. The family Gentium leaves the catalog, and its own rulings lapse: its gate K link to software.sil.org/gentium/, its category override (categories_22) and its L3 research entry; Charis's L3 research entry goes too. Microsoft Selawik keeps its id, its gate K link and its license ruling. As for SN Pro (sn_pro_fold_timing), the catalog takes the folds at the first live refresh."
reason = "The owner's ruling in chat with the lead session on 2026-09-30, \"Fold all five (Recommended)\", SN Pro being the fifth. SIL's FONTLOGs say \"Charis SIL is now Charis\" (silnrsi/font-charis v7.000), \"Gentium Plus is now Gentium\" and \"Gentium Book Plus is now Gentium Book\" (silnrsi/font-gentium); Fontist's selawik and Homebrew's font-selawik download the same github.com/microsoft/Selawik 1.01 release, whose font names itself Selawik. Survivors follow methodology section 2: Google's family is the unit, and a rename keeps the id (so Microsoft Selawik keeps its id, approved link and history, and only its display name changes). A replay of the 2026-09-26 snapshots with the rows: 499 fonts; Gentium leaves and Gentium Book Plus joins (overall 337); Gentium Plus 300 to 285, and #89 in most installed; Charis SIL 265 to 329, because Arch abstains in most chosen for praat (dep-arch-charis-sil); Selawik 266 to 265; elsewhere in the top 100s, moves of a place or so."

