ruling = "Charis SIL, Gentium Plus and Gentium Book Plus keep their ids and Google's names, as Google Fonts lists them; SIL's new names (Charis, Gentium, Gentium Book) are also-known-as names that count toward them."
reason = "Claude's recommendation, taken by the owner: methodology section 2 makes Google's family the unit, the primary link is Google's page under that name, and Google's files call themselves that. The ruling relayed by the lead had said \"into the current upstream name\"; Claude flagged that the rules pick Google's names."

[duplicates_batch_3]
value = "fold_all_seven"
ruling = "Seven retired or split names fold into their live successor, as the earlier folds of 2026-09-30 did, and the catalog takes them at the first live refresh (sn_pro_fold_timing): Scheherazade into Scheherazade New (with Debian's fonts-sil-scheherazade and ttf-sil-scheherazade, Fontsource's scheherazade and its npm and Expo packages); OFL Sorts Mill Goudy TT into Sorts Mill Goudy; Rubik One into Rubik; Big Shoulders Display and Big Shoulders Text into Big Shoulders as optical-size builds (opsz), so the catalog entry moves from big-shoulders-display to big-shoulders, with the Expo package of the old one; Yaldevi Colombo into Yaldevi; Sansita One into Sansita; and Finlandica into Finlandica Headline (A-8f8a1dea58, with Finlandica's Expo package; Finlandica Text stays related). Hand rows in data/aliases.csv (reviewed_by owner:2026-09-30). Scheherazade's L3 research entry goes; big-shoulders-display's automatic link and specimen lapse, and so does Claude's U-b9de6781828e, which sent the Expo key there."
reason = "The owner's ruling in chat with the lead session on 2026-09-30, \"Fold all seven (Recommended)\", after verified evidence: SIL's FONTLOG and Google's TRIVIA.md (Scheherazade); one upstream commit and cmap (OFL Sorts Mill Goudy TT); Google's description of Rubik One as Rubik's first Black; Big Shoulders' README and google/fonts to_delist.txt (Display and Text are the static opsz splits of the variable family); the designers' FONTLOGs (Yaldevi Colombo, Sansita One); and the shipped cut (Finlandica). Survivors follow methodology section 2: Google's live family is the unit, and the published id stays where both ids were minted in the same run, as for SN Pro (#43)."

