choice = "a"
recommended = true
value = "fold_7"
ruling = "Seven of the no-license families that would reach the overall top 700 are builds of catalog families and fold into them (hand rows in data/aliases.csv, source hand): Inconsolata for Powerline, Inconsolata Bold for Powerline and Inconsolata-dz for Powerline into Inconsolata (build powerline); Delugia Code into Cascadia Code (Delugia and Delugia Complete build nerd, Delugia Book build nfp, Delugia Powerline build powerline), with the two Delugia Mono casks, which patch Cascadia Mono, into Cascadia Mono; Meslo LG DZ into Meslo LG; Recursive Code into Recursive; Monaspace Frozen into the Monaspace bundle (bundle rows for the five Monaspace families, as for Monaspace itself)."
reason = "Claude's recommendation (nolicense_25): each is the family's own build under the approved gate A rules (build variants fold into their family; Monaspace is a bundle under D2). The Delugia Mono casks follow the same build rule: adam7/delugia-code builds Delugia Mono from Cascadia Mono, which is a family of its own (A-945958a9f1)."

