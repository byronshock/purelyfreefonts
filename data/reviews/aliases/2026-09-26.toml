value = "accept_all"
ruling = "Bundle rows for Noto, iA Writer, MPlus and Monaspace; ProggyCleanTT is ProggyClean; oldlib's wrong merges, 5 noisy name_tables rows and the deb-src rows of 31 non-font sources are rejected; ttf-dejavu-nerd is DejaVu Sans Mono; fonts-noto-mono is Noto Mono; hand rows for the Monocraft Nerd builds, 6 Edu families under old names and the Nerd sub-family names fonts.json does not give (MesloLGS NF, JetBrainsMonoNL Nerd Font, MonaspiceNe Nerd Font)."
reason = "Claude's recommendation, as summarised to the owner in chat. Applied: the bundle rows and ProggyClean in data/aliases.csv; the old run's merges (Cascadia Mono, InconsolataGo and LGC, Ubuntu Condensed, the Noto Sans JP/KR/SC/TC casks, Source Han Sans and Noto Sans CJK JP) and the five name_tables rows as rulings of this file; the 31 non-font Debian sources as NON_FONT_SOURCES in aliases/miners/distro.py (26 programs whose own section is not fonts, and 5 font tools filed under fonts that ship no font: font-manager, font-v, fontconfig, fontforge, ttfautohint), with the deb-src rows of ibm-3270 and powerline also rejected here; the Monocraft hand rows (brew-cask font-monocraft-nerd-font and the name Monocraft with Nerd glyphs, build nerd) in data/aliases.csv. Not applied: the 6 Edu hand rows. Their premise, that Google serves Edu NSW ACT Foundation as Edu NSW ACT Cursive, is wrong: Google and Fontsource list the 2022 families (Foundation, Beginner) and the 2025 ones (Cursive, Hand, Hand Pre) as separate live families with their own popularity and subsets, so the rows would merge two live families. That went back to the owner, who withdrew the rows on 2026-09-28 (../2026-09-28.toml, edu). The Nerd sub-family names are hand rows in data/aliases.csv (font-name, build): MesloLGS NF to Meslo LG (nf), JetBrainsMonoNL Nerd Font to JetBrains Mono (nerd), MonaspiceNe Nerd Font to Monaspace Neon (nerd). The chat summary had left them out, but the question the owner approved (integration A, the gate A hand-row question) named them; no source key uses them yet. Corrected on 2026-09-28: the premise that InconsolataGo is a separate fork was wrong (it is Raph Levien's own straight-quote Inconsolata), and fonts-noto-mono no longer maps to Noto Mono; the owner's rulings of 2026-09-28 (../aliases/2026-09-28.toml: inconsolatago, noto_mono) replace those parts. The 6 Edu hand rows go back to the owner as a question of 2026-09-28, with the six Fontsource Edu merges removed from this file."

[A_sources]
value = "accept_all"
ruling = "Google renames are auto-accepted only when the two names share a designer; Finlandica is related to its split families; 42dot Sans is Asta Sans, plus 2 renames (Saira Stencil One to Saira Stencil, Montserrat Subrayada to Montserrat Underline); retired Fontsource names are mapped (League and Ostrich builds, Golos UI to Golos Text, iA Writer Duospace to iA Writer Duo, Vazir to Vazirmatn); Material Icons Rounded is ineligible; DSEG7 and DSEG14 are rejected; the 53-repo GitHub list is approved and its 914 plain rows accepted; distro package contents are researched before their rows are accepted; Homebrew's deprecation replacement casks (font-iosevka-comfy to font-aporetic) are not mined as alias rows, with a hand row only if the volume ever matters."
reason = "Claude's recommendation."

