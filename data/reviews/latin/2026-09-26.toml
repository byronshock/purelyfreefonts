# Owner rulings of 2026-09-26, given in chat after integration A (the first real run). Ruled by
# the owner, Byron Shock; recorded by Claude from the lead's notes (design/rulings-2026-09-26.toml).
# Also in AUTHORITY.md. Where the owner picked Claude's recommendation, the reason is Claude's summary.

[L1]
choice = "a"
recommended = true
value = "relaxed"
ruling = "The relaxed thresholds, measured on the first real run: at most 2 GF_Latin_Kernel code points missing; a Latin share of at least 30%; coverage \"extended\" with at most 3 GF_Latin_Core code points missing, of any kind; under 1,000 CJK code points. In ranking.toml [latin] (kernel_missing_max, core_missing_max, latin_share_min)."
reason = "Claude's recommendation after measuring: the strict Kernel test failed fonts that lack only the trademark sign or the minus (Fantasque Sans Mono), and 40% failed pan-Unicode fonts with complete Latin (DejaVu Sans, FreeSerif, JuliaMono)."

[menu_only_google]
value = "glyph_test"
ruling = "Google families served only with the menu subset (104 Playwrite families and Allkin) take the non-Google glyph test automatically."
reason = "Claude's recommendation: Google's metadata says nothing about their script."

[L-single-day]
choice = "b"
recommended = false
ruling = "Keep it out"
reason = "Claude's recommendation in chat: mainly CJK (a Korean font with no primary script); the gate L ruling keeps it out. recommended is false only because the queue question itself carries no recommended option."

[L2_rule]
value = "include_327_leave_out_116"
ruling = "The dual-script Google families (D4's reviewed short list): include every one with full Latin Extended that is not a script companion, and leave out the script companions (a script-named family whose base family, the name without its script or region part, is already in the universe: Noto Sans Arabic of Noto Sans, Hind Siliguri of Hind, IBM Plex Sans Arabic of IBM Plex Sans, Anek Telugu of Anek Latin) and the families with basic Latin only. The owner can move any family later."
reason = "Claude's recommendation, taken by the owner in chat. The owner was shown the rule with a count of 327 in and 116 out (57 companions, 59 with basic Latin only). The per-family lists below are Claude's application of the rule; the count differs, see L2-companions."

