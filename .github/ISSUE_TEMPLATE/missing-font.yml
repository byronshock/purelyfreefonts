# "Missing font" (Milestone 2 step 12, M2-D10). The rules below restate
# AUTHORITY.md's Rules 1-4 and D3 in plain words; change them together.
name: Missing font
description: A free font you think belongs in the list isn't there.
title: "Missing font: "
labels: ["missing-font"]
body:
  - type: markdown
    attributes:
      value: |
        **Reports are public:** anyone can read them, so please leave out anything private. No GitHub account? Email admin@trulyfreefonts.com instead.

        Please search the list first, including the font's old names: "Source Sans Pro" finds Source Sans 3. A font is listed only if:

        - its license lets anyone use it in any personal or commercial project, with no limits on use. Personal-use-only, demo, display-only and non-commercial licenses don't qualify, and neither do licenses that forbid modifying or embedding the font (such as the ITF Free Font License that many Fontshare fonts use), or copyleft licenses without a font exception (CC BY-SA, or the plain GPL, LGPL or AGPL);
        - it covers the Latin alphabet;
        - it is a font for text, not icons, emoji or symbols.

        The list shows about the 500 most-used fonts that qualify, so a less-used font may be missing on purpose. Tell us anyway if you think it's popular.
  - type: input
    id: font_name
    attributes:
      label: Font name
    validations:
      required: true
  - type: input
    id: official_url
    attributes:
      label: Official page
      description: Where the font's maker publishes it, such as a foundry page, a GitHub repository or its Google Fonts page.
      placeholder: https://
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License
      description: The license's name, if you know it. For example, SIL Open Font License 1.1.
  - type: textarea
    id: why
    attributes:
      label: Why it belongs
      description: Where you see it used, or why you think it's popular. Links help.
  - type: checkboxes
    id: searched
    attributes:
      label: Search
      options:
        - label: I searched the list for this font, including any other names it has.
          required: true
