# "Hard to use or confusing" (Milestone 2 step 12, M2-D10). The severity
# options use the same three levels as docs/usability-test.md, so reports from
# visitors and findings from test sessions can be sorted together.
name: Hard to use or confusing
description: Something on the site was hard to find, understand or use, on any device or with any assistive technology.
title: "Hard to use: "
labels: ["usability"]
body:
  - type: markdown
    attributes:
      value: |
        **Reports are public:** anyone can read them, so please leave out anything private. No GitHub account? Email admin@trulyfreefonts.com instead.

        Tell us in your own words; there are no wrong answers. If something is plainly broken, "Something's broken" is the better form.
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: What you saw, what you expected instead, and where you got stuck.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page address
      description: Copy it from the address bar. It includes your filters, so we see what you saw.
      placeholder: https://trulyfreefonts.com/
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Computer
        - Phone
        - Tablet
  - type: input
    id: setup
    attributes:
      label: Browser and assistive technology (optional)
      description: For example, Firefox on Windows; Safari on an iPhone with VoiceOver; keyboard only; or zoomed to 200%. Reports are public, so leave this out if you'd rather not say it here; you can email admin@trulyfreefonts.com instead.
  - type: dropdown
    id: severity
    attributes:
      label: How much did it get in your way?
      options:
        - It stopped me (blocker)
        - I got there, but only after a long detour or with help (major)
        - It slowed me down or annoyed me (minor)
