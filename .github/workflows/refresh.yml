name: Refresh

# The monthly catalog refresh (milestone-1 step 19; design-m1 §4; gate CI1 (rec)).
#
# Five jobs, so the ones that download and parse third-party data hold no write token:
#
# 0. npm (contents: read, no store key): fetch npm's download counts alone, into an empty
#    store, and upload the day's snapshot. npm's download API accepts 20 requests a minute
#    from a runner, so its 4,700-odd packages take about four hours; in its own job they
#    have its own six hours, and the refresh job about one (owner ruling of 2026-10-19,
#    npm_own_job). If it fails or runs out of time, the refresh job doesn't fetch npm
#    itself: parse uses the last npm snapshot within the stale window, flagged stale. It
#    can't see the store, so a new dispatch fetches npm again (about four hours) even when
#    the store has the day's snapshot, which is then kept; "Re-run failed jobs" doesn't.
# 1. refresh (contents: read): place the npm job's snapshot in the store, fetch every
#    other source into the private snapshot store and
#    run the pipeline (tff-catalog refresh), then commit the new snapshots to the store
#    locally, even when the run failed, so a rerun the same day reuses them. Replay the
#    same snapshots offline from a clean checkout of the same commit; build/ must come
#    out identical (methodology §9: a rerun from the same snapshots giving different
#    output is a hard failure). It uploads the store's new commits as an encrypted git
#    bundle and the pull request's files as an artifact. The store is cloned without
#    keeping its key, and the job's GITHUB_TOKEN can only read (the collectors' API budget).
# 2. store (actions: write): decrypts that bundle, pushes it to the data repository, and
#    deletes its artifact. It runs no repository code.
# 3. publish (contents, pull-requests and actions: write): opens or updates the pull
#    request on the fixed branch refresh/monthly with the artifact's files (build/
#    outputs, build/state/ copied to state/, and the alias table and seeds the run
#    changed). A later run replaces an unmerged one (or, when main's workflows changed
#    in between, deletes its branch, which closes it, and opens a new one). Pushes made
#    with GITHUB_TOKEN start no workflows, so this job dispatches ci.yml on the branch
#    itself; its checks attach to the branch's head commit. This needs "Allow GitHub
#    Actions to create and approve pull requests". It parses nothing from the run.
# 4. report (issues: write): a hard failure anywhere opens (or comments on) an issue. An
#    npm fetch that fails or times out is not one: its job carries on, and the stale npm
#    source shows in the pull request.
#
# Nothing from the run's log goes into the issue or the pull request: rulings T2
# and T4 keep Google and Fonts Over Time raw values private.
#
# The data store's key, DATA_STORE_KEY, is a secret of the environment "refresh", whose
# deployments are limited to main (store_key_environment_timing, ops/SERVER.md item 27a):
# only the refresh and store jobs name it. A dispatch from any other branch fails at the
# refresh job before its first step, and report opens its issue.
#
# The store bundle is encrypted with STORE_BUNDLE_KEY, a secret of the same environment
# (store_bundle_encrypted, 2026-10-19): any signed-in GitHub user can download a public
# repository's artifacts, and the store holds the Google Fonts and Fonts Over Time
# snapshots that rulings T2 and T4 keep private. Without the key the refresh job fails
# before it fetches anything. The store job checks the decrypted bundle against the
# sha256 the refresh job reports, and deletes the run's store-bundle artifacts (every
# attempt's) once the push has landed.
#
# Until milestone-refresh.md step 1 turns it on (owner ruling of 2026-09-29), the schedule
# does nothing: a scheduled run starts only once the repository variable REFRESH_SCHEDULE is
# "on" (gh variable set REFRESH_SCHEDULE --body on). A skipped refresh skips the other jobs
# too, and opens no issue. Dispatches from main always run.

on:
  schedule:
    - cron: "17 6 3 * *" # 06:17 UTC on the 3rd of each month
  workflow_dispatch:
    inputs:
      from_snapshots:
        description: "Replay the store's snapshots of this date (YYYY-MM-DD) instead of fetching"
        required: false
        default: ""
        type: string
      write_fit:
        description: "Fit the model and keep the fit in the store when none is stored for the date: the switch (2026-10-17) and owner-ruled refits only"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  npm:
    name: npm
    # Owner ruling of 2026-09-29: scheduled runs wait for REFRESH_SCHEDULE == 'on'. Only main
    # runs it: from another branch the refresh job fails at its environment anyway.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.REFRESH_SCHEDULE == 'on') }}
    runs-on: ubuntu-24.04
    # GitHub's runners stop any job at 360 minutes; the fetch step stops first, at 340.
    timeout-minutes: 355
    # Read only, and no store key: it fetches into an empty store and uploads one snapshot.
    permissions:
      contents: read
    outputs:
      run_date: ${{ steps.prep.outputs.run_date }}
      # 'true' only once the artifact is uploaded: a failed upload leaves the run to fall back.
      snapshot: ${{ steps.upload.outcome == 'success' && 'true' || 'false' }}
    env:
      FROM_SNAPSHOTS: ${{ inputs.from_snapshots }}
      TFF_STORE: ${{ github.workspace }}/_npm_store
      TFF_STORE_PUSH: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - run: uv sync --locked

      # The run's date is fixed here, at the start, and the refresh job takes it from this
      # job: a run that crosses midnight UTC keeps one date.
      - name: Prepare the npm fetch
        id: prep
        run: |
          echo "/_npm_store/" >> .git/info/exclude
          mkdir -p _npm_store
          echo "TFF_RAW=$RUNNER_TEMP/raw" >> "$GITHUB_ENV"
          if [ -n "$FROM_SNAPSHOTS" ]; then
            if ! [[ "$FROM_SNAPSHOTS" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::from_snapshots must be YYYY-MM-DD, got '$FROM_SNAPSHOTS'"
              exit 1
            fi
            run_date=$FROM_SNAPSHOTS
          else
            run_date=$(date -u +%F)
          fi
          echo "run_date=$run_date" >> "$GITHUB_OUTPUT"

      # A failure or a timeout here leaves the run to fall back on the last npm snapshot.
      - name: Fetch npm
        id: fetch
        if: ${{ env.FROM_SNAPSHOTS == '' }}
        continue-on-error: true
        timeout-minutes: 340
        env:
          RUN_DATE: ${{ steps.prep.outputs.run_date }}
        run: |
          start=$SECONDS
          uv run --locked tff-catalog -v fetch --date "$RUN_DATE" --only npm
          echo "npm fetch of $RUN_DATE: $((SECONDS - start)) s" >> "$GITHUB_STEP_SUMMARY"

      # Only a complete snapshot goes on: a killed fetch leaves npm/<date>.tmp, never
      # npm/<date> with a complete manifest.
      - name: Check the npm snapshot
        id: check
        if: ${{ !cancelled() && steps.fetch.outcome != 'skipped' }}
        env:
          RUN_DATE: ${{ steps.prep.outputs.run_date }}
        run: |
          manifest="_npm_store/npm/$RUN_DATE/manifest.json"
          if [ -f "$manifest" ] && jq -e '.complete == true' "$manifest" > /dev/null; then
            echo "snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no complete npm snapshot of $RUN_DATE; the run falls back on the last one"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: ${{ !cancelled() && steps.check.outputs.snapshot == 'true' }}
        with:
          name: npm-snapshot
          path: _npm_store/npm/${{ steps.prep.outputs.run_date }}
          if-no-files-found: error
          retention-days: 7

  refresh:
    name: refresh
    needs: npm
    # Owner ruling of 2026-09-29: scheduled runs wait for REFRESH_SCHEDULE == 'on'. It runs
    # after the npm job whatever that job's outcome (npm_own_job).
    if: ${{ !cancelled() && (github.event_name != 'schedule' || vars.REFRESH_SCHEDULE == 'on') }}
    # DATA_STORE_KEY is a secret of the environment "refresh", which only main may use
    # (store_key_environment_timing, 2026-10-16), so no other branch's workflow can read it.
    environment: refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    # Read only: this job downloads and parses third-party data, so it holds no write token.
    # Its GITHUB_TOKEN is the collectors' GitHub API budget (1,000 requests an hour).
    permissions:
      contents: read
    outputs:
      run_date: ${{ steps.prep.outputs.run_date }}
      store_bundle: ${{ steps.store-bundle.outputs.bundle }}
      store_bundle_sha256: ${{ steps.store-bundle.outputs.sha256 }}
      pull_request: ${{ steps.pr-files.outputs.changed }}
    # Job-level env may use only the github, needs, strategy, matrix, vars, secrets and
    # inputs contexts (not runner), so Prepare sets TFF_RAW from $RUNNER_TEMP.
    env:
      BRANCH: refresh/monthly
      FROM_SNAPSHOTS: ${{ inputs.from_snapshots }}
      NPM_RUN_DATE: ${{ needs.npm.outputs.run_date }}
      NPM_SNAPSHOT: ${{ needs.npm.outputs.snapshot }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TFF_STORE: ${{ github.workspace }}/_store
      # The store's new commits are pushed by the "store" job, which holds its key.
      TFF_STORE_PUSH: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before anything is fetched: a run that could not upload its store bundle would
      # lose its snapshots (store_bundle_encrypted).
      - name: Check the store bundle's key
        env:
          STORE_BUNDLE_KEY: ${{ secrets.STORE_BUNDLE_KEY }}
        run: |
          if [ -z "$STORE_BUNDLE_KEY" ]; then
            echo "::error::STORE_BUNDLE_KEY is not set in the environment refresh (store_bundle_encrypted)"
            exit 1
          fi

      # The key clones the store and is not kept: nothing later in this job can push.
      - name: Check out the snapshot store
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: byronshock/trulyfreefonts-data
          ssh-key: ${{ secrets.DATA_STORE_KEY }}
          path: _store
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - run: uv sync --locked

      # Stage "specimens" renders every catalog font from ~/.cache/tff/fonts; without the
      # cache each run downloads every font again.
      - name: Cache the font files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tff/fonts
          key: tff-fonts-refresh-${{ github.run_id }}
          restore-keys: tff-fonts-refresh-

      - name: Prepare
        id: prep
        run: |
          # The store is a separate clone inside the workspace: never part of a commit here.
          echo "/_store/" >> .git/info/exclude
          echo "TFF_RAW=$RUNNER_TEMP/raw" >> "$GITHUB_ENV"
          if [ -n "$FROM_SNAPSHOTS" ]; then
            if ! [[ "$FROM_SNAPSHOTS" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::from_snapshots must be YYYY-MM-DD, got '$FROM_SNAPSHOTS'"
              exit 1
            fi
            run_date=$FROM_SNAPSHOTS
          elif [ -n "$NPM_RUN_DATE" ]; then
            run_date=$NPM_RUN_DATE  # fixed when the npm job started (npm_own_job)
          else
            run_date=$(date -u +%F)
          fi
          echo "run_date=$run_date" >> "$GITHUB_OUTPUT"
          git -C _store config user.name "github-actions[bot]"
          git -C _store config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # An artifact that is gone (a re-run after its 7 days) or fails to download is no
      # failure: the run then keeps the store's npm snapshot of the day, or falls back.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: npm-download
        if: ${{ env.FROM_SNAPSHOTS == '' && env.NPM_SNAPSHOT == 'true' }}
        continue-on-error: true
        with:
          name: npm-snapshot
          path: ${{ runner.temp }}/npm-snapshot

      # The npm job's snapshot joins the store as fetched today. A snapshot the store already
      # has for the day is never replaced.
      - name: Place the npm snapshot
        if: ${{ env.FROM_SNAPSHOTS == '' && steps.npm-download.outcome == 'success' }}
        env:
          RUN_DATE: ${{ steps.prep.outputs.run_date }}
        run: |
          target="_store/npm/$RUN_DATE"
          if [ -e "$target" ]; then
            echo "The store already has $target; keeping it." >> "$GITHUB_STEP_SUMMARY"
          else
            mkdir -p _store/npm
            cp -R "$RUNNER_TEMP/npm-snapshot" "$target"
            echo "npm: the npm job's snapshot of $RUN_DATE is placed in the store." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Refresh
        id: refresh
        env:
          RUN_DATE: ${{ steps.prep.outputs.run_date }}
          # The GitHub API budget of the collectors (1,000 requests an hour); read only.
          GITHUB_TOKEN: ${{ github.token }}
          # Only a dispatch that asks for it, never the schedule (q9_theta_cadence).
          WRITE_FIT: ${{ github.event_name == 'workflow_dispatch' && inputs.write_fit }}
        run: |
          # --write-fit: with no stored model fit for the date, fit it and keep it in the
          # store, once (fitstore). Only the switch, the replay of the held run of 2026-10-17
          # (october_replay_is_the_switch), and refits the owner rules ask for it
          # (q9_theta_cadence); every other run reads the stored fit, and stops without one.
          # The offline replay below reads it back.
          args=(refresh --date "$RUN_DATE")
          if [ "$WRITE_FIT" = true ]; then
            args+=(--write-fit)
          fi
          if [ -n "$FROM_SNAPSHOTS" ]; then
            args+=(--from-snapshots "$FROM_SNAPSHOTS")
          else
            # The npm job fetched npm, or failed to: either way this job doesn't ask npm.
            args+=(--skip-fetch npm)
          fi
          start=$SECONDS
          uv run --locked tff-catalog -v "${args[@]}"
          echo "Refresh of $RUN_DATE: $((SECONDS - start)) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the specimens' size budget
        if: ${{ !cancelled() && steps.refresh.outcome == 'success' }}
        run: uv run --locked tff-catalog specimens --check

      - name: Check the store
        id: store-check
        if: ${{ !cancelled() && steps.refresh.outcome != 'skipped' }}
        run: uv run --locked tff-catalog store check

      - name: Commit the new snapshots to the store
        if: ${{ !cancelled() && steps.store-check.outcome == 'success' }}
        env:
          RUN_DATE: ${{ steps.prep.outputs.run_date }}
        run: uv run --locked tff-catalog store commit -m "snapshots $RUN_DATE"

      # Only the encrypted file is in the uploaded folder; the plain bundle is written
      # beside it and removed (store_bundle_encrypted). The store job decrypts with the
      # same cipher, digest and iteration count.
      - name: Bundle the store's new commits
        id: store-bundle
        if: ${{ !cancelled() && steps.store-check.outcome == 'success' }}
        env:
          STORE_BUNDLE_KEY: ${{ secrets.STORE_BUNDLE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/store" "$RUNNER_TEMP/store-plain"
          # Commits the clone has beyond the fetched head; none (nothing new) is no bundle.
          if [ -n "$(git -C _store rev-list '@{upstream}..HEAD')" ]; then
            if [ -z "$STORE_BUNDLE_KEY" ]; then
              echo "::error::STORE_BUNDLE_KEY is not set: the store bundle is not uploaded"
              exit 1
            fi
            plain="$RUNNER_TEMP/store-plain/store.bundle"
            git -C _store bundle create "$plain" '@{upstream}..HEAD'
            sha=$(sha256sum "$plain" | cut -d ' ' -f 1)
            openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -salt \
              -pass env:STORE_BUNDLE_KEY -in "$plain" -out "$RUNNER_TEMP/store/store.bundle.enc"
            rm -f "$plain"
            echo "sha256=$sha" >> "$GITHUB_OUTPUT"
            echo "bundle=true" >> "$GITHUB_OUTPUT"
          else
            echo "bundle=false" >> "$GITHUB_OUTPUT"
            echo "No new snapshots to push to the store." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.store-bundle.outputs.bundle == 'true' }}
        with:
          name: store-bundle
          path: ${{ runner.temp }}/store
          if-no-files-found: error
          retention-days: 7

      - name: Replay offline from a clean checkout
        env:
          RUN_DATE: ${{ steps.prep.outputs.run_date }}
        run: |
          snapshots=${FROM_SNAPSHOTS:-$RUN_DATE}
          replay="$RUNNER_TEMP/replay"
          git worktree add --detach "$replay" HEAD
          # The live run's miners rewrote data/alias-seeds/ and refresh may have applied
          # accepted rows to data/aliases.csv. The pull request carries both, so the
          # replay, which runs no miner, starts from them.
          rm -rf "$replay/data/alias-seeds"
          cp -R data/alias-seeds data/aliases.csv "$replay/data/"
          cd "$replay"
          uv sync --locked
          # Cut the network where the runner allows it: root makes the namespace, the
          # replay runs in it as the runner user, with this step's environment. The
          # whole wrapper is tried first, so a runner that refuses any part of it
          # falls back to a warning instead of failing the run.
          offline=(sudo -n --preserve-env unshare --net --
            sudo -n --preserve-env -u "$(id -un)" env "PATH=$PATH")
          if ! "${offline[@]}" true 2>/dev/null; then
            offline=()
            echo "::warning::could not cut the network; the replay ran with it up"
          fi
          start=$SECONDS
          "${offline[@]}" uv run --locked --offline tff-catalog -v refresh \
            --date "$RUN_DATE" --from-snapshots "$snapshots"
          echo "Offline replay: $((SECONDS - start)) s" >> "$GITHUB_STEP_SUMMARY"
          if ! diff -r --brief --exclude=cache "$GITHUB_WORKSPACE/build" "$replay/build"; then
            echo "::error::the replay of $snapshots gave a different build/"
            exit 1
          fi
          if ! diff --brief "$GITHUB_WORKSPACE/data/aliases.csv" "$replay/data/aliases.csv"; then
            echo "::error::the replay of $snapshots gave a different data/aliases.csv"
            exit 1
          fi
          echo "Replay matched: identical build/" >> "$GITHUB_STEP_SUMMARY"

      # The pull request's commit is made here and handed over as a git bundle, so the job
      # that pushes it parses nothing the run produced.
      - name: Commit the pull request's files
        id: pr-files
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          RUN_DATE: ${{ steps.prep.outputs.run_date }}
        run: |
          git switch --force-create "$BRANCH"
          # Merging this pull request is what advances state/ (design-m1 §5).
          uv run --locked python -c \
            'from pathlib import Path; from tff_catalog.state import apply_state; apply_state(Path("state"), Path("build/state"))'
          # .gitignore keeps build/stage, build/state, build/cache and the review pack out.
          # The alias table and seeds change when refresh applied accepted rows or a miner
          # found new candidates (the replay above started from them).
          git add --all -- state build data/aliases.csv data/alias-seeds
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed against main; no pull request." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Monthly refresh $RUN_DATE" -m "Run: $RUN_URL"
          out="$RUNNER_TEMP/pull-request"
          mkdir -p "$out"
          git bundle create "$out/pr.bundle" "$GITHUB_SHA..$BRANCH"
          stale=none
          if [ -f build/stage/stale.json ]; then
            stale=$(jq -r 'to_entries | map(.key + (if .value.dropped then " (dropped)" else "" end))
              | join(", ") | if . == "" then "none" else . end' build/stage/stale.json)
          fi
          printf '%s\n' "$stale" > "$out/stale.txt"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.pr-files.outputs.changed == 'true' }}
        with:
          name: pull-request
          path: ${{ runner.temp }}/pull-request
          if-no-files-found: error
          retention-days: 7

  store:
    name: store
    needs: refresh
    if: ${{ !cancelled() && needs.refresh.outputs.store_bundle == 'true' }}
    environment: refresh  # DATA_STORE_KEY and STORE_BUNDLE_KEY, as in the refresh job
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write # deletes the store bundle's artifact after the push
    steps:
      - name: Check out the snapshot store
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: byronshock/trulyfreefonts-data
          ssh-key: ${{ secrets.DATA_STORE_KEY }}
          path: _store
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-bundle
          path: ${{ runner.temp }}/store
      - name: Decrypt the store bundle
        env:
          STORE_BUNDLE_KEY: ${{ secrets.STORE_BUNDLE_KEY }}
          BUNDLE_SHA256: ${{ needs.refresh.outputs.store_bundle_sha256 }}
        run: |
          if [ -z "$STORE_BUNDLE_KEY" ] || [ -z "$BUNDLE_SHA256" ]; then
            echo "::error::the store bundle's key or sha256 is missing (store_bundle_encrypted)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/store-plain"
          plain="$RUNNER_TEMP/store-plain/store.bundle"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 \
            -pass env:STORE_BUNDLE_KEY -in "$RUNNER_TEMP/store/store.bundle.enc" -out "$plain"
          # The cipher has no integrity check of its own: the sha256 comes through the job's
          # outputs, not the artifact.
          if [ "$(sha256sum "$plain" | cut -d ' ' -f 1)" != "$BUNDLE_SHA256" ]; then
            echo "::error::the decrypted store bundle does not match the refresh job's sha256"
            exit 1
          fi
      # A rerun after the push landed (say the delete below failed) clones the store at the
      # bundle's tip, which lacks the bundle's prerequisite, so it only checks the tip is there.
      - name: Push the new snapshots to the store
        run: |
          plain="$RUNNER_TEMP/store-plain/store.bundle"
          tip=$(git -C _store bundle list-heads "$plain" HEAD | cut -d ' ' -f 1)
          if [ -n "$tip" ] && git -C _store cat-file -e "$tip^{commit}" 2>/dev/null; then
            echo "The store already has the bundle's commits ($tip)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -C _store bundle verify "$plain"
          git -C _store fetch --quiet "$plain" HEAD
          git -C _store merge --ff-only --quiet FETCH_HEAD
          git -C _store push --quiet origin HEAD
      # Only after the push: a failed push keeps the encrypted artifact for "Re-run failed jobs".
      # By name, so an earlier attempt's upload goes too.
      - name: Delete the store bundle's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=store-bundle&per_page=100" \
            --jq '.artifacts[].id')
          if [ -z "$ids" ]; then
            echo "::error::the run has no store-bundle artifact to delete"
            exit 1
          fi
          for id in $ids; do
            gh api --silent -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            echo "The store bundle's artifact $id is deleted." >> "$GITHUB_STEP_SUMMARY"
          done

  publish:
    name: publish
    needs: refresh
    # An explicit status check: without one, a failed npm job (an ancestor through refresh)
    # would skip this job even when the refresh job succeeded on the stale npm snapshot.
    if: ${{ !cancelled() && needs.refresh.result == 'success' && github.ref == 'refs/heads/main' && needs.refresh.outputs.pull_request == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # push refresh/monthly
      pull-requests: write # open or update its pull request
      actions: write # dispatch ci.yml on refresh/monthly (gate CI1)
    env:
      BRANCH: refresh/monthly
      RUN_DATE: ${{ needs.refresh.outputs.run_date }}
      FROM_SNAPSHOTS: ${{ inputs.from_snapshots }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pull-request
          path: ${{ runner.temp }}/pull-request
      - name: Open or update the refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git bundle verify "$RUNNER_TEMP/pull-request/pr.bundle"
          git fetch --quiet "$RUNNER_TEMP/pull-request/pr.bundle" "refs/heads/$BRANCH:refs/heads/$BRANCH"
          git switch --quiet "$BRANCH"
          # The refresh job may change only these paths; anything else is refused.
          outside=$(git diff --name-only "$GITHUB_SHA" HEAD -- . \
            ':!state' ':!build' ':!data/aliases.csv' ':!data/alias-seeds')
          if [ -n "$outside" ]; then
            echo "::error::the refresh commit changes files outside its paths: $outside"
            exit 1
          fi
          gh auth setup-git
          # GITHUB_TOKEN may not change .github/workflows on a branch, and moving the old
          # branch onto a main whose workflows have changed since would. Then delete it
          # first: GitHub closes its pull request, and a new one is opened below.
          if git fetch --quiet --depth=1 origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null &&
            ! git diff --quiet "origin/$BRANCH" HEAD -- .github/workflows; then
            echo "::notice::workflows changed on main since $BRANCH was pushed; replacing the branch"
            git push origin --delete "$BRANCH"
          fi
          git push --force origin "HEAD:refs/heads/$BRANCH"

          stale=$(head -n 1 "$RUNNER_TEMP/pull-request/stale.txt" | tr -cd '[:alnum:] ,()_-')
          title="Monthly refresh $RUN_DATE"
          body="$RUNNER_TEMP/pr-body.md"
          cat > "$body" <<EOF
          The monthly catalog refresh of $RUN_DATE ([run]($RUN_URL)).

          - Snapshots: ${FROM_SNAPSHOTS:-$RUN_DATE}. Stale or dropped sources: ${stale:-none}.
          - A replay of the same snapshots from a clean checkout gave an identical \`build/\`.
          - CI was dispatched on this branch; its checks appear below.

          Please review \`build/review.md\`: it lists entries, exits, big moves, license
          changes and every flag. Merging copies this run's state into \`state/\`. If this
          pull request is not merged, next month's run replaces it.
          EOF
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "$title" --body-file "$body"
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  report:
    name: report
    needs: [npm, refresh, store, publish]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # report a hard failure
    env:
      RUN_DATE: ${{ needs.refresh.outputs.run_date || needs.npm.outputs.run_date }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report the failure in an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Monthly refresh failed"
          body="$RUNNER_TEMP/issue-body.md"
          cat > "$body" <<EOF
          The refresh of ${RUN_DATE:-this month} failed: $RUN_URL

          The run log names the failed job and step and, for hard-check failures, each
          failure; if the refresh job failed, no refresh pull request was opened or
          updated. New snapshots were committed
          to the store if the store check passed, so "Re-run failed jobs" today reuses
          them (a new dispatch fetches npm again in its own job, about four hours, and then
          keeps the stored snapshot); a later rerun can replay them with the workflow's
          from_snapshots input.
          EOF
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
          fi
