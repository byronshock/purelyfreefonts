# gitleaks configuration for the CI "secrets" job.
# It extends gitleaks' built-in rules. Add an allowlist
# entry only for a reviewed false positive, with a comment saying why.

title = "purelyfreefonts"

[extend]
useDefault = true

# Reviewed false positive (2026-09-26): the specimen render index keys each specimen by the
# sha256 of what it was drawn from (font file, text, renderer), in a field named "key", which
# the generic-api-key rule reads as a secret. The file holds only public hashes and paths.
[[allowlists]]
description = "specimen render index: sha256 cache keys"
targetRules = ["generic-api-key"]
paths = ['''^build/specimens/index\.json$''']

# Reviewed false positive (2026-10-23): the hopper's parser vectors give each name's match key
# (the font name lower-cased with its spaces and punctuation removed, such as "fira9lttmcn") in
# a field named "key", which the generic-api-key rule reads as a secret when the name is long
# and mixed. The file holds only synthetic and public font names.
[[allowlists]]
description = "hopper parser vectors: match keys of font names"
targetRules = ["generic-api-key"]
paths = ['''^tests/vectors/owned-[a-z-]+\.json$''']
