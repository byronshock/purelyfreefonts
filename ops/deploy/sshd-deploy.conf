# /etc/ssh/sshd_config.d/10-deploy.conf for trulyfreefonts (source: ops/deploy/sshd-deploy.conf).
# Installed by "setup-server.sh stage-b", which also adds deploy and deploy-staging to
# AllowUsers in 00-hardening.conf, runs sshd -t and reloads ssh. See ops/deploy/README.md.
#
# The two deploy users can only run tff-receive, with the environment fixed here; the verb
# comes from SSH_ORIGINAL_COMMAND. Their keys live in root-owned files, and every kind of
# forwarding, PTY and user rc file is off. "Match all" ends the Match blocks, so the settings
# read after this file stay global.

Match User deploy
	AuthorizedKeysFile /etc/ssh/authorized_keys/deploy
	ForceCommand /usr/local/sbin/tff-receive production
Match User deploy-staging
	AuthorizedKeysFile /etc/ssh/authorized_keys/deploy-staging
	ForceCommand /usr/local/sbin/tff-receive staging
Match User deploy,deploy-staging
	AuthenticationMethods publickey
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	DisableForwarding yes
	AllowTcpForwarding no
	AllowStreamLocalForwarding no
	AllowAgentForwarding no
	X11Forwarding no
	PermitTTY no
	PermitTunnel no
	PermitUserRC no
	MaxSessions 2
Match all
