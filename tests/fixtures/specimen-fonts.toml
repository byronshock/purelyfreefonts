# Real, pinned OFL fonts for the specimen and "Type your own text" tests (Milestone 2 design §3).
#
# Each file is fetched at test time into ~/.cache/tff/fonts/<sha256> (CI caches that directory,
# keyed on this file's hash) and checked against its sha256 and size. The files are never
# committed. Tests that need them are marked `network` and skip when offline without a cache.
#
# `sample_id` is the synthetic font in tests/fixtures/catalog-site.sample.json whose font_file
# points at this file, so its specimen and "Type your own text" run on real outlines.
# Every url, sha256 and size below was verified by download on 2026-09-25.

version = 1

[[font]]
key = "inter"
repo = "google/fonts"
commit = "23e54b51ddffbc7713c583748e3bd86f62b1fa4a"
path = "ofl/inter/Inter[opsz,wght].ttf"
url = "https://raw.githubusercontent.com/google/fonts/23e54b51ddffbc7713c583748e3bd86f62b1fa4a/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf"
sha256 = "29160a80ff49ddcab2c97711247e08b1fab27a484a329ce8b813d820dc559031"
size = 876576
format = "ttf"
outlines = "glyf"
axes = ["opsz", "wght"]
latin = "extended"
license = "OFL-1.1"
license_url = "https://raw.githubusercontent.com/google/fonts/23e54b51ddffbc7713c583748e3bd86f62b1fa4a/ofl/inter/OFL.txt"
sample_id = "sample-sans-01"

