# --- Proposals after research (2026-09-26), waiting for the owner ---------------------------------
# Researched because no two sources agree on a link: Metropolis and Noto Mono (the owner
# asked for research at gate K), ProFont and Terminus (no candidate at all). Noto Mono
# gets no entry: Google no longer distributes it (see the lead's owner questions).

# --- K-metropolis-page ---------------------------------------------------------------------------

[[override]]
family = "metropolis"
name = "Metropolis"
question = "K-metropolis-page"
primary = "https://github.com/dw5/Metropolis"
primary_label = "GitHub: dw5/Metropolis (archived mirror)"
reason = "No official page is left: the designer, Chris Simpson, made his repository private in October 2020 after a dispute over the name, and wrote that anyone may fork it. dw5/Metropolis is an archived copy of its last commit (June 2020, Unlicense). It has no releases, so the link is the repository itself."

# --- K-profont-page ------------------------------------------------------------------------------

[[override]]
family = "profont"
name = "ProFont"
question = "K-profont-page"
primary = "https://tobiasjung.name/profont/"
reason = "Tobias Jung's ProFont site keeps the Windows, Mac and Linux versions under the MIT license (since 2014), and Nerd Fonts names it as ProFont's upstream. He maintains the distributions; ProFont was designed by Andrew Welch, Carl Osterwald and Stephen C. Gilardi."

# --- K-terminus-page -----------------------------------------------------------------------------

[[override]]
family = "terminus"
name = "Terminus"
question = "K-terminus-page"
primary = "https://terminus-font.sourceforge.net/"
reason = "The designer's own page, Dimitar Zhekov's Terminus Font home (SIL OFL 1.1), with the source release and a Windows installer. The TrueType build Nerd Fonts patches is Terminus TTF (files.ax86.net/terminus-ttf/), a third party's conversion, so it is not the official link."
