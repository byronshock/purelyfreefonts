# Official-link overrides (milestone-1 step 14; owner gate K). Read by tff_catalog.links.
#
# The link policy picks each family's links on its own: a live Google family links
# its Google Fonts specimen page, and any other family the designer's homepage or
# the repository's releases page that two sources agree on. An override replaces
# that choice for one family, for example when the designer's own release is
# fuller than the build Google Fonts serves.
#
# An override is only a proposal until the owner rules on its gate K question:
# it applies when the latest data/reviews/links/<YYYY-MM-DD>.toml answers
# `question` with `choice` ("a" = approve). Several families can share one
# question. For a catalog family the links queue left undecided
# (build/stage/queues/links.json), gate K asks the owner to pick one of its
# candidates on question "K-<family id>". A pick needs no entry here: the
# ruling records the picked option's text, "<url> (from <sources>)", and stage
# links takes the link from it (the queue's `overrides.picked`). When the owner
# asks for research (the queue's `overrides.research`), add the researched link
# under a new question id, such as "K-<family id>-page"; gate K then asks that
# question instead of the family's own.
#
# Fields (loaded strictly: unknown or missing keys fail):
#   family          family id (state/ids.json), listed once
#   name            display name, for the owner
#   question        the gate K question that approves it
#   choice          the answer that applies it (default "a")
#   primary         the official download link: https, never a release asset,
#                   /releases/latest, the googlefontdirectory-hg mirror or an aggregator
#   designer        optional second link, same rules
#   primary_label, designer_label
#                   optional destination names; by default the site derives one
#                   ("GitHub: rsms/inter", or the host name)
#   reason          why the override is needed
#
# All URLs below answered HTTP 200 on 2026-09-25 (the proposals at the end on 2026-09-26).

schema = 1

# --- K-inter ---------------------------------------------------------------------------------

[[override]]
family = "inter"
name = "Inter"
question = "K-inter"
primary = "https://rsms.me/inter/"
designer = "https://github.com/rsms/inter/releases"
reason = "The designer's site offers the full release (static and variable, desktop and web). Google Fonts serves its own build (Inter-4.1-GoogleFonts.zip in its METADATA.pb)."

