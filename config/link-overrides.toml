primary_label = "The Go Blog: Go fonts"
primary_note = "The Go project's announcement of its fonts, by Nigel Tao, Chuck Bigelow and Rob Pike. The TrueType files are in the Go image repository (go.googlesource.com/image), in font/gofont/ttfs, under the Go project's BSD-style license."
reason = "The Go fonts have no download page of their own. The Go project's post (16 November 2016) is the official page: it describes Go Mono, states the license and says where the TTF files are. Their folder on go.googlesource.com answered 503 to a scripted request on 2026-09-28, so the post is the steadier link."

