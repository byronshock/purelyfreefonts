# License classes (D3 in AUTHORITY.md, methodology §2, milestone-1 steps 2 and 6a).
#
# Filled by agent P3 with tff_catalog.licenses; the owner reviews it at gate C.
# Loaded strictly by tff_catalog.config into config_model.LicensesConfig:
# unknown or missing keys fail, and no id may sit in two classes.
#
# Keys are SPDX license ids, SPDX "<id> WITH <exception>" pairs, or
# LicenseRef-<name> for licenses SPDX lacks. Operators (AND, OR) never appear
# here: tff_catalog.licenses.classify combines the classes (OR takes the best
# branch, AND needs every part to pass).
#
# Three classes:
# - allowed: qualifies (Rule 1: all personal and commercial use, no use
#   restrictions). `group` is the license-class filter on the site and must be
#   an id in site.toml [[license_classes]]. `redistributable` must be true:
#   since 2026-09-30 Rule 3 lets in only licenses that allow passing the
#   files on, and an allowed entry with `redistributable = false` classifies
#   as excluded.
#   `attribution_required` is the CC BY badge (D3), not the notice that most
#   licenses ask to keep with redistributed copies.
# - excluded: never qualifies; `reason` names the rule.
# - ruling: the owner decides at gate LIC (data/reviews/licenses/); until then
#   every font that depends on it waits in the review queue.
#
# **Anything not listed is excluded (D3).** L1 (config/license-aliases.toml)
# maps every string a source writes onto the ids below; a string it cannot map
# goes to the review queue instead of being guessed.

schema = 1

