# L1 normalisation (milestone-1 step 6a): a license string exactly as a source
# writes it, mapped to an SPDX expression. Filled by agent P3
# (tff_catalog.licenses.normalize). Loaded strictly by tff_catalog.config into
# config_model.LicenseAliasesConfig: unknown or missing keys fail.
#
# How normalize() reads a string (whitespace runs count as one space):
# 1. "<collector>::<string>" for that collector, then "<string>" for any source;
#    exact first, then ignoring case.
# 2. An id that appears in any value below, in any case ("mit" -> "MIT").
# 3. A key ending in "*" matches any string that starts with the rest (longest wins).
# 4. Otherwise the string is split on AND, OR and WITH (any case) and
#    parentheses, and each part goes through 1-3 on its own, so
#    "OFL-1.1-no-RFN or LGPL-2.1-only" and "GPL-2+ with Font exception" work.
# A part that is still unknown makes the whole string unknown: it goes to the
# review queue (tff-catalog licenses --queue), never to a guess. So does an
# exception id outside WITH ("Font exception" on its own names no license).
#
# Values are canonical SPDX expressions. Every license id in them must be listed
# in config/licenses.toml (the tests check), so a mapping never makes a license
# excluded by accident. "NOASSERTION" means the source says nothing usable.
# Reserved Font Names are not a separate license: OFL-1.1-RFN is OFL-1.1.

schema = 1

[aliases]
# --- canonical ids (identity), so every id in licenses.toml is recognised ----
"OFL-1.1" = "OFL-1.1"
