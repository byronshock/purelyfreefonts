  "Liberation Serif",
  "Linux Biolinum G",
  "Linux Libertine G",
  "Lugrasimo",
  "Lumanosimo",
  "Lunasima",
  "Miriam CLM",
  "Miriam Libre",
  "Miriam Mono CLM",
  "Nachlieli CLM",
  "Noto Sans",
  "Noto Serif",
  "Reem Kufi",
  "Rubik",
  "Scheherazade",
]
source = "https://github.com/LibreOffice/core/tree/libreoffice-26-8/external/more_fonts"
note = """
The fonts LibreOffice 26.8 bundles in The Document Foundation's own installers, which \
make them visible to LibreOffice only; it also bundles Noto's Arabic, Armenian, \
Georgian, Hebrew, Lao and Lisu families. Linux distributions' LibreOffice packages \
bundle none: they depend on font packages, which the dependency parser sees. The \
entry says os = "app": the fonts come with an application, not an operating system, so \
it tags them without setting any "comes with" filter bit and never makes a Linux source \
abstain. The installers for Windows and macOS bundle the same fonts."""

