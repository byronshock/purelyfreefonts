# Ranking collector github_releases: lifetime download counts of the release
# assets of main-channel repos (ruling M2; open data, ruling T1). The engine
# source `github` in ranking.toml counts the growth between snapshots.
enabled = true

# REST paging: GitHub's largest page, and a cap per repo (older releases past
# it are left out, with a note in the manifest).
per_page = 100
max_pages = 20

# GraphQL repos: assets per release per page, the assets one query may ask
# for (GitHub cut a query of 960 short on 2026-09-26 with
# RESOURCE_LIMITS_EXCEEDED; 600 passed), and a cap on asset pages per release.
asset_page = 100
graphql_nodes = 500
max_asset_pages = 20

# This collector's share of the run's github budget (fetch.GITHUB_BUDGET, 900
# with an Actions token); nerd_releases and the others need the rest. The
# fetch of 2026-09-26 used 77 (52 REST pages, 25 GraphQL queries for Iosevka).
max_requests = 300

# A repo whose asset count falls under this share of the previous snapshot's
# is noted; all repos together under it fail the fetch (the stale policy then
# reuses the last good snapshot).
min_share = 0.5

# Release files that are not fonts: checksums, signatures, notes, previews,
# license files, FontForge and editor sources, source archives.
skip_assets = '(?i)(\.(asc|sig|minisig|sha1|sha256|sha512|md5|txt|md|json|ya?ml|pdf|png|jpe?g|gif|svg|html?|sfd|vim)$|sha\d*sums?|checksums?|^(licen[cs]e|copying|readme|notice)(\.\w+)?$|^sources?\.(zip|7z|tar\.\w+)$)'

# --- Main-channel repos --------------------------------------------------------
# A repo is listed when its GitHub releases are an official download of the
# font: the font's site or README points there. Seeded from the old library's
# repo table and the scouts (2026-09-25); the owner reviews the list.
# Left out on purpose:
# - ryanoasis/nerd-fonts: the nerd_releases collector counts it;
# - repos whose releases carry no assets (checked 2026-09-26): Meslo LG,
#   Liberation, Red Hat, Victor Mono, STIX Two, Monoid, Fira Sans (mozilla/Fira),
#   iA Writer, Comic Shanns, Tamzen, Hermit, Gohu, Reddit Sans, Open Sauce,
#   Twilio Sans Mono;
# - google/fonts builds and googlefonts/* repos whose official download is
#   Google Fonts (Inconsolata, Atkinson Hyperlegible);
# - CJK-primary families that the Latin gate (D4) excludes anyway (Source Han,
#   Sarasa Gothic, LXGW, Pretendard, HackGen, PlemolJP, UDEV Gothic, pixel CJK);
# - icon and emoji fonts (Font Awesome, Twemoji, OpenMoji).
# - romeovs/creep: Creep is in no catalog source and unmaintained since 2014, so it
#   stays out of the universe (owner ruling of 2026-09-28, creep).
#
# Each [[repos]] table:
#   repo    "owner/name" as GitHub spells it; the key prefix (keys keep it after a rename)
#   family  the family it publishes (a hint for the github_repos alias miner)
#   api     "rest" (default) or "graphql" (repos with hundreds of assets per release)
#   latest  0 = every release, no cap by date (ruling M2); N = only the newest N
#   assets  keep only assets whose name matches this regex ("" keeps all)
#   strip   extra regexes removed from asset names to form the key, for
#           versions the generic rule (tag version, dotted versions, commit
#           hashes) misses
#
# Adding or removing a repo changes the contract fixture's recorded requests:
# rebuild it with `uv run python -m tests.collectors.github_releases.build_fixture`.

[[repos]]
repo = "0xType/0xProto"
family = "0xProto"

[[repos]]
repo = "adobe-fonts/source-code-pro"
family = "Source Code Pro"
# Adobe versions: 2.042R-u_1.062R-i_1.026Rvf, 3v028R, _v1020
strip = ['(?:[-_]v?|v)\d+(?:\.\d+)*R(?:-(?:ro|it|u|i)|vf)?', '_v\d+$']

[[repos]]
repo = "adobe-fonts/source-sans"
family = "Source Sans 3"
# Adobe versions: 2.042R-u_1.062R-i_1.026Rvf, 3v028R, _v1020
strip = ['(?:[-_]v?|v)\d+(?:\.\d+)*R(?:-(?:ro|it|u|i)|vf)?', '_v\d+$']

[[repos]]
repo = "adobe-fonts/source-serif"
family = "Source Serif 4"
