# Hidden Nerd Font builds (owner ruling of 2026-09-29, TASK-2). Read by stage "links".
#
# Stage "links" links a family's Nerd Font build (links.nerd): the maker's own NF build, or
# the Nerd Fonts project's folder when its base license qualifies (src/tff_catalog/links.py).
# A family listed here gets no links.nerd at all, so the site shows no "Nerd Font available"
# tag, no "NF" marker or Nerd link in its details and no filter match for it, whatever
# build it has. This is the owner's switch for a build that fails a check the pipeline
# can't make, such as the pre-launch check of its patched icon sets' licenses
# (docs/milestone-2.md step 14, docs/nerd-fonts-link.md).
#
# Entries (loaded strictly with the rest of config/; `tff-catalog config` prints them and
# they count toward the config hash):
#   <family id> = "<reason>"
#   family id   a family id from the id registry (state/ids.json), listed once
#   reason      why its build is hidden, in plain words (required)
# A malformed id or an empty reason fails every command that loads the config.
# `tff-catalog config --strict` also fails on an id missing from the id registry, and stage
# "links" fails on an id that names no family of the run's universe (a typo, or a family
# renamed or merged away since). The run's links queue (build/stage/queues/links.json,
# nerd.unlinked) lists each hidden family with its reason.
#
# Record the owner's ruling in data/reviews/<gate>/<YYYY-MM-DD>.toml and AUTHORITY.md
# first, then add its entry here under a comment naming it.

schema = 1

[families]
