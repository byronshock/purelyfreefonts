[foundries.fontshare]
# Only Roundo: of Fontshare's 36 OFL families it is the one not on Google Fonts. Fontshare's
# other 64 families use the ITF Free Font License, which AUTHORITY Rule 4 excludes. The license
# string is the Fontshare API's license_type.
name = "Fontshare (Indian Type Foundry)"
url = "https://www.fontshare.com"

# Fontshare's page links this repository; it has no license file, so only Fontshare
# states the OFL. Fontshare answers 200 for any /fonts/<slug>, even a missing one.
[[foundries.fontshare.families]]
name = "Roundo"
url = "https://www.fontshare.com/fonts/roundo"
license = "sil_ofl"
repository = "https://github.com/itfoundry/roundo"
