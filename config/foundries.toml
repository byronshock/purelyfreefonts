# Families from foundries outside the big directories (methodology §2
# universe; gate M12 (rec): a hand list, seeded once from the foundries and
# not scraped each month).
#
# Seeded on 2026-09-25 by agent I3; the owner reviews it with preinstalled.toml
# (gate C). The collector u/foundries reads it and HEAD-checks every URL.
# Loaded strictly by tff_catalog.config into config_model.FoundriesConfig:
# unknown or missing keys fail.
#
# - Being on this list is never popularity; it only adds candidates to the
#   universe. A family that is also on Google Fonts or Fontsource merges with it
#   there by name.
# - license is the foundry's own wording; L1 (config/license-aliases.toml)
#   normalises it, and the license gates decide. "NOASSERTION" means the foundry
#   states none.
# - url is the family's page at the foundry. Where the foundry's website blocks
#   AI agents (Velvetyne, Collletttivo), it is the family's repository under the
#   foundry's own account instead.
# - The milestone's "Roundo" is a family, not a foundry: Roundo by the Indian
#   Type Foundry, published on Fontshare under the OFL.
#
# [foundries.<id>]                  # foundry id: lower case, digits, "-" or "_"
# name = "Velvetyne Type Foundry"
# url = "https://velvetyne.fr"
#
# [[foundries.<id>.families]]       # sorted by name, ignoring case
# name = "Sligoil"
# url = "https://gitlab.com/velvetyne/sligoil"
# license = "SIL Open Font License 1.1"
# repository = "https://gitlab.com/velvetyne/sligoil"   # optional
# files = ["https://gitlab.com/velvetyne/sligoil/-/raw/<commit>/fonts/..."]   # optional
#
# files: one font file per family, pinned to the repository's commit of 2026-09-26, so
# the Latin gate and L3 can read a family only this list knows (without a file it fails
# as "no readable file"). Picked by Claude from each repository's tree: the Regular (or
# the first upright) desktop file. A family whose repository holds no font file (its
# files are in releases) has none yet.

schema = 1

