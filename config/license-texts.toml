# License-text research for gate L3 (milestone-1 step 6b). Read by tff_catalog.license_l3.
#
# Owner ruling L3_32 (2026-09-26): Claude researches every family that fails the
# automatic license check and brings the owner only genuine conflicts. This file
# records what that research found for the technical failures, so the check reads
# the right evidence. It never overrides a failure: every text is still matched,
# every notice and name ID is still read for restrictions, and a changed text
# fails again and goes back to the queue.
#
# [[family]]: one per researched family.
#   family     family id (state/ids.json), listed once
#   name       display name, for people
#   reason     what the research found
#   texts      upstream license files, tried before the sources' texts (pin a commit
#              where the upstream has one)
#   files      upstream font files, read before the sources' files
#   mentions   license families (as license_l3.mentions names them: "Public-domain",
#              "Apache", ...) that the family's notices and name IDs 13 and 14 may name
#              besides its L2 license. Each must be the family of an allowed license.
#
# [[text]]: a license file that matches no canonical text in data/license-texts/
# but holds the listed licenses; research read it word for word. It is matched
# by the sha256 of its bytes, so any change to it fails the check again. Its
# whole text, license bodies included, is read for restrictions and for other
# licenses; only the word limits on notices are waived for it.
#   sha256     of the file's bytes
#   licenses   the SPDX ids it verifies
#   url        where it was read
#   reason     how it differs from the canonical texts
#
# Researched 2026-09-28; every URL below answered HTTP 200 that day.

schema = 1

