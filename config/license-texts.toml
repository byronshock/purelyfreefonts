[[family]]
family = "roboto-condensed"
name = "Roboto Condensed"
mentions = ["Apache"]
reason = "Google Fonts lists it under OFL-1.1 (ofl/robotocondensed, OFL.txt, METADATA.pb license OFL), but its font file, v3.008, was built in July 2023 from googlefonts/roboto-classic at commit 8aa699a, while that repository was still under Apache-2.0; name IDs 13 and 14 kept that label. Upstream moved its sources to OFL-1.1 in January 2024 (commit bfc4c5e, 'Update license strings to OFL'). Both licenses are allowed, redistributable and without an attribution badge, so the label changes nothing."

